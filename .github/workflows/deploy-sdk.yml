name: Deploy SDK

# Only run after a pull request has been merged. This is because
# bot account runs write operations on the github repo to push a tag.
on:
  push:
    branches: [main] # all branches where deployments currently occur. Make sure this list matches list of branches in  `.releaserc` file.

permissions:
  id-token: write
  contents: write # access to push the git tag
  issues: write # Bot creates an issue if there is an issue during deployment process
  pull-requests: write # allow bot to make comments on PRs after they get deployed

jobs:
  deploy-git-tag:
    name: Deploy git tag
    runs-on: ubuntu-latest
    outputs:
      new_release_git_head: ${{ steps.semantic-release.outputs.new_release_git_head }}
      new_release_published: ${{ steps.semantic-release.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic-release.outputs.new_release_version }}
    steps:
      
      - name: 'Generate token'
        id: generate_token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.CIO_APP_CLIENT_ID }}
          private-key: ${{ secrets.CIO_APP_SECRET }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.generate_token.outputs.token }}

      # scripts/update-version.sh (run by semantic-release) uses sd to bump the Android config version.
      - name: Install sd CLI to use later in the workflow
        uses: ./.github/actions/setup-sd

      - name: Deploy git tag via semantic release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        id: semantic-release
        with:
          # Every version here is pinned deliberately. The conventionalcommits 10.x line renders
          # through @conventional-changelog/template, which needs conventional-changelog-writer@9;
          # every released semantic-release resolves writer@8, so 10.x cannot render here.
          #
          # Dependabot cannot see these versions: the `github-actions` ecosystem only resolves
          # `uses:` refs, and no ecosystem parses `extra_plugins`. An unpinned entry silently
          # floats to whatever is `latest` at release time, so bump these by hand.
          semantic_version: 25.0.9
          extra_plugins: |
            conventional-changelog-conventionalcommits@9.3.1
            @semantic-release/github@12.0.9
            @semantic-release/exec@7.1.0
        env:
          # Needs to push git commits to repo. Needs write access.
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Notify team of git tag being created
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        if: steps.semantic-release.outputs.new_release_published == 'true'
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # Leave `errors` at its default (false): failing this step would fail the job and skip
          # deploy-npm, so a Slack outage must not block publishing a tag that already exists.
          # Use block kit to format the Slack message: https://app.slack.com/block-kit-builder
          payload: |
            {
              "text": "ReactNative SDK git tag created",
              "username": "ReactNative deployment bot",
              "icon_url": "https://vectorified.com/images/icon-react-native-24.png",
              "channel": "#mobile-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*ReactNative* SDK git tag created successfully! (deployment step 1 of 2)"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Version ${{ steps.semantic-release.outputs.new_release_version }}*\n\nReactNative SDK deployment progress:\n ~1. <https://github.com/${{github.repository}}/releases/tag/${{steps.semantic-release.outputs.new_release_version}}|create git tag>~\n2. deploy to npm\n\n"
                  }
                }
              ]
            }

      - name: Notify team of failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        if: ${{ failure() }} # only run this if any previous step failed
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # The job is already failing; surface a broken webhook instead of only logging a warning.
          errors: true
          # Use block kit to format the Slack message: https://app.slack.com/block-kit-builder
          payload: |
            {
              "text": "ReactNative SDK deployment failure",
              "username": "ReactNative deployment bot",
              "icon_url": "https://vectorified.com/images/icon-react-native-24.png",
              "channel": "#mobile-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*ReactNative* SDK deployment :warning: failure :warning:"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "ReactNative SDK failed deployment during step *create git tag*. View <https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}|CI server logs> to learn why and fix the issue. <https://github.com/customerio/mobile/blob/main/GIT-WORKFLOW.md|Learn more about the deployment process and how to fix errors>."
                  }
                }
              ]
            }

  # The only job that publishes to npm, and it cannot be started by hand: this workflow
  # runs on push to main, and nothing in the repo exposes a dispatchable publish.
  #
  # To publish a version whose release failed, re-run THIS job from the Actions UI on the
  # `Deploy SDK` run for that version — it checks out the release commit
  # (`new_release_git_head`) and authenticates via OIDC through `environment: release`.
  # Prefer that over adding a `workflow_dispatch` publish: a standalone publish workflow
  # needs a long-lived NPM_TOKEN, which is the thing OIDC is here to avoid.
  deploy-npm:
    name: Deploy to npm
    needs: [deploy-git-tag]
    if: needs.deploy-git-tag.outputs.new_release_published == 'true' # only run if a git tag was made.
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.deploy-git-tag.outputs.new_release_git_head }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Pinned to the 11.x line rather than @latest. OIDC needs >= 11.5.1, which 11.x satisfies.
      # Node 24 no longer caps us at 11.x the way node 20 did, but the npm that node 24 bundles
      # varies by patch release and is not guaranteed to clear 11.5.1 — so keep publishing on an
      # explicit pin rather than on whatever npm the runner happens to ship.
      # Raise this deliberately, not by drifting with @latest.
      - name: Install npm 11.5.1+ for OIDC support
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run pre-deploy
        run: npm run pre-deploy

      - name: Publish to npm
        run: npm publish --tag latest

      - name: Notify team of successful deployment
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        if: ${{ success() }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # `errors` stays false: npm already has the release, so a Slack failure must not report
          # this deployment as failed.
          # Use block kit to format the Slack message: https://app.slack.com/block-kit-builder
          payload: |
            {
              "text": "ReactNative SDK deployed to npm",
              "username": "ReactNative deployment bot",
              "icon_url": "https://vectorified.com/images/icon-react-native-24.png",
              "channel": "#mobile-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*ReactNative* SDK deployed to npm! (deployment step 2 of 2)"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Version ${{ needs.deploy-git-tag.outputs.new_release_version }}*\n\nReactNative SDK deployment progress:\n ~1. <https://github.com/${{github.repository}}/releases/tag/${{ needs.deploy-git-tag.outputs.new_release_version }}|create git tag>~\n~2. deploy to npm~\n\n"
                  }
                }
              ]
            }

      - name: Notify team of failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        if: ${{ failure() }} # only run this if any previous step failed
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # The job is already failing; surface a broken webhook instead of only logging a warning.
          errors: true
          # Use block kit to format the Slack message: https://app.slack.com/block-kit-builder
          payload: |
            {
              "text": "ReactNative SDK deployment failure",
              "username": "ReactNative deployment bot",
              "icon_url": "https://vectorified.com/images/icon-react-native-24.png",
              "channel": "#mobile-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*ReactNative* SDK deployment :warning: failure :warning:"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "ReactNative SDK failed deployment during step *deploy to npm*. View <https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}|CI server logs> to learn why and fix the issue. <https://github.com/customerio/mobile/blob/main/GIT-WORKFLOW.md|Learn more about the deployment process and how to fix errors>."
                  }
                }
              ]
            }

  publish-sample-apps-public-builds:
    # `deploy-git-tag` is needed for its `new_release_version` output, not for ordering. Right after
    # publishing, npm's `latest` tag can still name the previous release.
    needs: [deploy-git-tag, deploy-npm]
    uses: ./.github/workflows/build-release-sample-apps.yml
    with:
      sdk_version: ${{ needs.deploy-git-tag.outputs.new_release_version }}
    secrets: inherit
