name: Full React Native scene routing E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/react-native-scene-e2e.yml'
      - '.github/workflows/react-native-scene-e2e-full.yml'
      - '.maestro/**'
      - 'src/**'
      - 'ios/wrappers/**'
      - 'ios/cocoapods_deployment_target.rb'
      - 'customerio-reactnative.podspec'
      - 'customerio-reactnative-richpush.podspec'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  full-scene-e2e:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ci:full') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:full') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    uses: ./.github/workflows/react-native-scene-e2e.yml
    with:
      full: true
