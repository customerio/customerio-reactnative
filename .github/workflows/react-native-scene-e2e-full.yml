name: Full React Native scene routing E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  full-scene-e2e:
    if: >-
      ((github.event.action == 'labeled' && github.event.label.name == 'ci:full') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'ci:full'))) &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/react-native-scene-e2e.yml
    with:
      full: true
