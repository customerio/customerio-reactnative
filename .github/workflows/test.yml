name: Test

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-deploy:
    name: Test able to deploy to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci

      - name: Compile
        run: npm run typescript

      - name: Unit tests
        run: npm test -- --runInBand --no-watchman

      # `npm pack`, not `npm publish --dry-run`. From npm 11 (which node 24 bundles) a dry-run
      # publish also runs the registry-side preflight, so it fails with "cannot publish over the
      # previously published versions" on any branch whose version semantic-release has not bumped
      # yet -- which is every PR. npm 10 skipped that check, which is why node 20 never tripped it.
      # This validates the package's lifecycle scripts and file contents, not the registry
      # handshake -- the deploy workflow remains the actual publish boundary.
      - name: Package test
        run: npm pack --dry-run

  assert-lint:
    name: Assert lint check passes and no lint errors exist
    permissions:
      checks: write # for eslint annotation action to create check for the PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint:report

      - name: Annotate Code Linting Results
        uses: ataylorme/eslint-annotate-action@21a1ba0738d8b732639999029c4ff40b6e121bb4 # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          check-name: 'eslint results'
          only-pr-files: false 
          fail-on-warning: false 
          fail-on-error: true 
          markdown-report-on-step-summary: true 
          report-json: "eslint_report.json"
