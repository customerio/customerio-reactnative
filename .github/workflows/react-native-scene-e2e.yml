name: React Native scene routing E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - '.github/workflows/react-native-scene-e2e.yml'
      - '.github/workflows/react-native-scene-e2e-full.yml'
      - '.maestro/**'
      - 'src/**'
      - 'ios/wrappers/**'
      - 'ios/cocoapods_deployment_target.rb'
      - 'customerio-reactnative.podspec'
      - 'customerio-reactnative-richpush.podspec'
      - 'scripts/test_ios_deep_link_request_store.swift'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run the label-triggered full lane.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.full && 'full' || 'direct' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route-notifications:
    name: RN scene notification routing on Xcode 27
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (inputs.full == true ||
      (github.event.action != 'edited' &&
      !contains(github.event.pull_request.labels.*.name, 'ci:full') &&
      !startsWith(github.event.pull_request.title, 'fix:') &&
      !startsWith(github.event.pull_request.title, 'fix(') &&
      !startsWith(github.event.pull_request.title, 'feat:') &&
      !startsWith(github.event.pull_request.title, 'feat(') &&
      !startsWith(github.event.pull_request.title, 'perf:') &&
      !startsWith(github.event.pull_request.title, 'perf(') &&
      !startsWith(github.event.pull_request.title, 'revert:') &&
      !startsWith(github.event.pull_request.title, 'revert(') &&
      !startsWith(github.event.pull_request.title, 'Revert "') &&
      !contains(github.event.pull_request.body, 'This reverts commit') &&
      !contains(github.event.pull_request.title, '!:') &&
      !contains(github.event.pull_request.body, 'BREAKING CHANGE:') &&
      !contains(github.event.pull_request.body, 'BREAKING CHANGES:') &&
      !contains(github.event.pull_request.body, 'BREAKING-CHANGE:')))
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Check out React Native SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Xcode 27 toolchain
        uses: customerio/mobile-ci-tools/github-actions/ios/report-toolchain/v1@main
        with:
          expected-xcode-major: '27'
          expected-ios-sdk-major: '27'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'

      - name: Install Maestro
        shell: bash
        run: |
          set -euo pipefail
          maestro_zip="$RUNNER_TEMP/maestro-2.8.0.zip"
          maestro_dir="$RUNNER_TEMP/maestro-2.8.0"
          curl -fsSL \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.8.0/maestro.zip \
            -o "$maestro_zip"
          echo 'b3e561161904fb391875ca5834d5b22cf0b01c052dd1b408ad83e30d8f8951b3  '"$maestro_zip" \
            | shasum -a 256 -c -
          unzip -q "$maestro_zip" -d "$maestro_dir"
          echo "$maestro_dir/maestro/bin" >> "$GITHUB_PATH"

      - name: Test deep-link acknowledgement state
        shell: bash
        run: |
          xcrun swiftc \
            ios/wrappers/CustomerIOReactNativeDeepLinkRequestStore.swift \
            scripts/test_ios_deep_link_request_store.swift \
            -o "$RUNNER_TEMP/test-ios-deep-link-request-store"
          "$RUNNER_TEMP/test-ios-deep-link-request-store"

      - name: Test warm and terminated notification routing
        shell: bash
        env:
          E2E_IOS_RUNTIME_MAJOR: '27'
          E2E_SIMULATOR_NAME: iPhone 17 Pro
        run: .maestro/run_scene_push.sh

      - name: Upload Maestro diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: react-native-scene-maestro-diagnostics
          path: ${{ runner.temp }}/react-native-scene-maestro-*
          if-no-files-found: ignore
          retention-days: 7
