name: Publish Release Sample App

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "SDK version to build sample app with (optional, e.g., 4.1.0, defaults to latest)"
        required: false
        type: string
  workflow_call:
    inputs:
      sdk_version:
        description: "Published SDK version to build the sample apps with. The deploy workflow passes the version it just published."
        required: false
        type: string
        default: ""

jobs:
  determine-branch:
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.get_branch.outputs.branch }}
    steps:
      - name: Extract Branch Name
        id: get_branch
        run: echo "branch=$(echo $GITHUB_REF_NAME)" >> $GITHUB_OUTPUT

  determine-sdk-version:
    runs-on: ubuntu-latest
    # The wait fails on its own after 60 minutes; the extra time lets it report what is missing.
    timeout-minutes: 70
    outputs:
      resolved_version: ${{ steps.get_version.outputs.sdk_version }}
    steps:
      - name: Get Latest SDK Version (if not provided)
        id: get_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          SDK_VERSION_INPUT: ${{ inputs.sdk_version }}
        run: |
          if [[ -n "$SDK_VERSION_INPUT" ]]; then
            echo "sdk_version=$SDK_VERSION_INPUT" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            LATEST_VERSION=$(npm show customerio-reactnative version)
            echo "Using latest SDK version: $LATEST_VERSION"
            echo "sdk_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          else
            # Right after publishing, npm's `latest` tag can still name the previous release.
            echo "::error::A release build needs sdk_version passed in from the job that published the release."
            exit 1
          fi

      # Both build jobs need this job, so neither installs the SDK before npm serves it.
      - name: Wait until customerio-reactnative is downloadable
        uses: customerio/mobile-ci-tools/github-actions/wait-until-downloadable/v1@main
        with:
          ecosystem: npm
          version: ${{ steps.get_version.outputs.sdk_version }}
          packages: customerio-reactnative

  build-sample-app-ios:
    needs: [determine-branch, determine-sdk-version]
    uses: ./.github/workflows/build-sample-app.yml
    with:
      app_name: "APN"
      branch_name: ${{ needs.determine-branch.outputs.branch_name }}
      cio-workspace-name: "Mobile: React Native"
      platform: "ios"
      platform_name: "iOS"
      platform_name_upper: "IOS"
      sdk_version: ${{ needs.determine-sdk-version.outputs.resolved_version }}
    secrets: inherit

  build-sample-app-android:
    needs: [determine-branch, determine-sdk-version]
    uses: ./.github/workflows/build-sample-app.yml
    with:
      app_name: "APN"
      branch_name: ${{ needs.determine-branch.outputs.branch_name }}
      cio-workspace-name: "Mobile: React Native"
      platform: "android"
      platform_name: "Android"
      platform_name_upper: "ANDROID"
      sdk_version: ${{ needs.determine-sdk-version.outputs.resolved_version }}
    secrets: inherit
