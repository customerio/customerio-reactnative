name: Publish Test Sample Apps

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
  push:
    branches: [main]

concurrency: # cancel previous workflow run if one exists.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ci:full') && github.run_id || 'validation' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Select sample app lane
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select verification or distribution matrix
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_PR: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [[ "$EVENT_NAME" == 'pull_request' && "$FULL_PR" != 'true' ]]; then
            echo 'matrix=[{"name":"APN","cio-workspace-name":"Mobile: React Native","platform":"ios","platform_name":"iOS","platform_name_upper":"IOS","should_distribute":false},{"name":"APN","cio-workspace-name":"Mobile: React Native","platform":"android","platform_name":"Android","platform_name_upper":"ANDROID","should_distribute":false}]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[{"name":"APN","cio-workspace-name":"Mobile: React Native","platform":"ios","platform_name":"iOS","platform_name_upper":"IOS","should_distribute":true},{"name":"FCM","cio-workspace-name":"Mobile: xReact Native FCM workspace","platform":"ios","platform_name":"iOS","platform_name_upper":"IOS","should_distribute":true},{"name":"APN","cio-workspace-name":"Mobile: React Native","platform":"android","platform_name":"Android","platform_name_upper":"ANDROID","should_distribute":true}]' >> "$GITHUB_OUTPUT"
          fi

  update-pr-comment:
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'ci:full') &&
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'ci:full') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # to be able to comment on PR
    outputs:
      comment-id: ${{ steps.create-comment.outputs.comment-id }}
    steps:
      - name: Find Comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: existing-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: <!-- sample app builds -->

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        id: create-comment
        with:
          comment-id: ${{ steps.existing-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- sample app builds --> 
            # Sample app builds 📱

            Below you will find the list of the latest versions of the sample apps. It's recommended to always download the latest builds of the sample apps to accurately test the pull request. 

            ---
            Builds are in progress. This comment will be updated when they finish.
          edit-mode: replace # replace the existing comment with new content since we are creating new builds

  build-sample-apps:
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:full')
    needs: [prepare, update-pr-comment]
    strategy:
      fail-fast: false # if one sample app fails to build, let the other sample apps continue to build and not cancel them.
      matrix: # Use a matrix allowing us to build multiple apps in parallel. Just add an entry to the matrix and it will build!
        sample-app: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    name: Building the ${{ matrix.sample-app.platform_name }} ${{ matrix.sample-app.name }} sample app
    uses: ./.github/workflows/build-sample-app.yml
    with:
      app_name: ${{ matrix.sample-app.name }}
      cio-workspace-name: ${{ matrix.sample-app.cio-workspace-name }}
      platform: ${{ matrix.sample-app.platform }}
      platform_name: ${{ matrix.sample-app.platform_name }}
      platform_name_upper: ${{ matrix.sample-app.platform_name_upper }}
      should_distribute: ${{ matrix.sample-app.should_distribute }}

    secrets: inherit

  # Update PR comment with build information
  update-pr-comment-with-status:
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'ci:full') &&
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'ci:full') &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [build-sample-apps, update-pr-comment]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # to be able to comment on PR
    strategy:
      matrix: # Have a matrix make it easier to update the PR comment with the build information for each sample app.
        sample-app:
          - name: 'APN'
            platform_name: 'iOS'
          - name: 'APN'
            platform_name: 'Android'
          - name: 'FCM'
            platform_name: 'iOS'
    steps:
      - name: Update sample builds PR comment with build information
        if: ${{ github.event_name == 'pull_request' }}
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ needs.update-pr-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            * ${{ matrix.sample-app.platform_name }} ${{ matrix.sample-app.name }}: `${{ needs.build-sample-apps.outputs.app_version_name }} (${{ needs.build-sample-apps.outputs.app_version_code }})`
          edit-mode: append # append new line to the existing PR comment to build a list of all sample app builds.

      - name: Update sample builds PR comment with build failure message
        if: ${{ github.event_name == 'pull_request' && failure() }}
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ needs.update-pr-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            * ${{ matrix.sample-app.platform_name }} ${{ matrix.sample-app.name }}: Build failed. See [CI job logs](https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}) to determine the issue and try re-building.
          edit-mode: append # append new line to the existing PR comment to build a list of all sample app builds.
