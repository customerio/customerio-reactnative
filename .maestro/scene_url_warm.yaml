appId: org.reactjs.native.example.CioRnSceneHost
name: React Native UIScene ordinary URL, warm
---
# run_scene_push.sh opens EXPECTED_URL only after the Routing assertion completes, so the
# app is still in front and SpringBoard's "Open in" prompt is answered as soon as it appears.
- extendedWaitUntil:
    visible: 'Customer.io React Native scene E2E ready'
    timeout: 60000
- assertVisible: 'Routing: acknowledged'
- extendedWaitUntil:
    visible: 'Open'
    timeout: 60000
- tapOn: 'Open'
- extendedWaitUntil:
    visible: 'Received: ${EXPECTED_URL}'
    timeout: 60000
